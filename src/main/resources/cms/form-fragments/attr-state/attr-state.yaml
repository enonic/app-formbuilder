kind: "FormFragment"
title: "Attr: State (checkbox)"
form:
  - type: "RadioButton"
    name: "state"
    label: "Initial state"
    occurrences:
      min: 0
      max: 1
    options:
      - value: "unchecked"
        label: "Unchecked"
      - value: "checked"
        label: "Checked"
      - value: "indeterminate"
        label: "Indeterminate"
    default: "unchecked"
    helpText: "[Optional] Initial state of the checkbox. 'Indeterminate' is an in-between state that forces the user to select or unselect."
