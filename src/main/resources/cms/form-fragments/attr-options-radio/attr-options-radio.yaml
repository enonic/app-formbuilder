kind: "FormFragment"
title: "Attr: Options (radio)"
form:
  - type: "ItemSet"
    name: "options"
    label: "Option"
    occurrences:
      min: 2
      max: 0
    items:
      - type: "TextLine"
        name: "optionText"
        label: "Label"
        occurrences:
          min: 1
          max: 1
        helpText: "[Required] Text shown next to the radio button."
      - type: "TextLine"
        name: "optionValue"
        label: "Value"
        occurrences:
          min: 1
          max: 1
        helpText: "[Required] Value submitted when this option is selected."
      - type: "CheckBox"
        name: "optionChecked"
        label: "Selected by default"
        occurrences:
          min: 0
          max: 1
        helpText: "[Optional] Pre-select this option. For dropdown menus, pre-select NO MORE THAN ONE option."
