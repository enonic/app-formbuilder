kind: "ContentType"
title: "Form"
description: "Input configuration and web form setup"
superType: "base:structured"
form:
  - type: "FieldSet"
    label: "Form elements"
    items:
      - type: "ItemSet"
        name: "inputs"
        label: "Input field"
        occurrences:
          min: 1
          max: 0
        items:
          - type: "FormFragment"
            name: "attr-label"
          - type: "FormFragment"
            name: "attr-required"
          - type: "OptionSet"
            name: "input"
            label: "Type and config"
            expanded: false
            occurrences:
              min: 1
              max: 1
            selection:
              min: 1
              max: 1
            options:
              - name: "text"
                label: "Text line"
                items:
                  - type: "FormFragment"
                    name: "attr-placeholder"
                  - type: "FormFragment"
                    name: "attr-value"
              - name: "textarea"
                label: "Text area"
                items:
                  - type: "FormFragment"
                    name: "attr-placeholder"
                  - type: "FormFragment"
                    name: "attr-value"
              - name: "email"
                label: "E-mail"
                items:
                  - type: "FormFragment"
                    name: "attr-placeholder"
              - name: "checkbox"
                label: "Checkbox"
                items:
                  - type: "HtmlArea"
                    name: "text"
                    label: "Rich text label"
                    occurrences:
                      min: 0
                      max: 1
                    exclude: "*"
                    include: "Bold Italic Underline | Link Unlink | SpecialChar"
                    helpText: "Overrides the label, e.g. to link to terms & conditions. Keep it short: screen readers read out the whole text."
                  - type: "FormFragment"
                    name: "attr-title"
              - name: "checkboxes"
                label: "Checkboxes group"
                items:
                  - type: "FormFragment"
                    name: "attr-options-radio"
                  - type: "FormFragment"
                    name: "attr-title"
              - name: "radio"
                label: "Radio buttons"
                items:
                  - type: "FormFragment"
                    name: "attr-options-radio"
                  - type: "FormFragment"
                    name: "attr-title"
              - name: "select"
                label: "Dropdown menu"
                items:
                  - type: "FormFragment"
                    name: "attr-placeholder"
                  - type: "FormFragment"
                    name: "attr-options-radio"
              - name: "file"
                label: "File"
                items:
                  - type: "FormFragment"
                    name: "attr-multiple"
                  - type: "FormFragment"
                    name: "attr-accept"
                  - type: "FormFragment"
                    name: "attr-title"
          - type: "FormFragment"
            name: "attr-name"
      - type: "TextLine"
        name: "submitText"
        label: "Submit button-text"
        occurrences:
          min: 0
          max: 1
        helpText: "Custom text for the submit button. Defaults to \"Submit\" in the browser language."
      - type: "HtmlArea"
        name: "successMessage"
        label: "Thank you message"
        occurrences:
          min: 0
          max: 1
        helpText: "Message shown to the user after the form is submitted."
  - type: "FieldSet"
    label: "Send data by e-mail"
    items:
      - type: "TextLine"
        name: "emailSubscribers"
        label: "To"
        occurrences:
          min: 0
          max: 0
        helpText: "Optional. These addresses receive the raw form response data by e-mail, with uploaded files attached."
        regexp: "^\\S+@\\S+$"
      - type: "TextLine"
        name: "emailFrom"
        label: "From"
        occurrences:
          min: 0
          max: 1
        helpText: "\"From\" address, e.g. \"Customer Service\" <noreply@example.com> or just noreply@example.com. If empty, the address from the site config is used."
        regexp: "^\\S+.*\\S+@\\S+$"
      - type: "TextLine"
        name: "emailSubject"
        label: "Subject"
        occurrences:
          min: 0
          max: 1
        helpText: "Custom e-mail subject. Defaults to the form heading, or the display name if neither is set."
      - type: "OptionSet"
        name: "receipt"
        label: "E-mail receipt back to user"
        expanded: false
        occurrences:
          min: 1
          max: 1
        helpText: "Requires one of the Input Fields above to be of type \"e-mail\" and \"required\"."
        selection:
          min: 1
          max: 1
        options:
          - name: "disabled"
            label: "No, do not send receipt"
            selected: true
          - name: "enabled"
            label: "Yes, send receipt"
            helpText: "Requires one of the Input Fields above to be of type \"e-mail\" and \"required\"."
            items:
              - type: "HtmlArea"
                name: "message"
                label: "Receipt message"
                occurrences:
                  min: 1
                  max: 1
                helpText: "Requires one of the Input Fields above to be of type \"e-mail\" and \"required\"."
              - type: "CheckBox"
                name: "includeFormData"
                label: "Include summary of submitted form data"
                occurrences:
                  min: 0
                  max: 1
