kind: "CMS"
form:
  - type: "FieldSet"
    label: "Basic required settings"
    items:
      - type: "TextLine"
        name: "emailFrom"
        label: "E-mail FROM address"
        occurrences:
          min: 0
          max: 1
        regexp: "^\\S+@\\S+$"
        helpText: "Default \"from\" address, e.g. \"Customer Service\" <noreply@example.com> or just noreply@example.com. If empty, the default sender from the XP config is used."
      - type: "RadioButton"
        name: "storageLocation"
        label: "User-submitted data: Storage location and access policy"
        occurrences:
          min: 1
          max: 1
        options:
          - value: "none"
            label: "Minimal: No storage, only send the data by e-mail"
          - value: "formbuilderRepo"
            label: "Regular: Also store the data on the server, but only available in reports"
        default: "formbuilderRepo"
        helpText: "With \"Minimal\", each form MUST have a working e-mail address, or data is lost if the e-mail isn't sent. \"Regular\" enables reports with the widget."
      - type: "RadioButton"
        name: "style"
        label: "Form style"
        occurrences:
          min: 1
          max: 1
        options:
          - value: "inherit"
            label: "Inherit browser default / site CSS"
          - value: "bootstrap"
            label: "Twitter Bootstrap"
        default: "bootstrap"
        helpText: "Global styling for forms. \"Browser default\" loads no extra style sheet, so the page's own CSS applies. \"Twitter Bootstrap\" uses v3.3.5."
  - type: "FieldSet"
    label: "reCAPTCHA v2 (anti-spam measure)"
    items:
      - type: "TextLine"
        name: "recaptchaSiteKey"
        label: "reCAPTCHA v2 Site Key"
        occurrences:
          min: 0
          max: 1
        helpText: "Both keys are required to enable reCAPTCHA. Manage your v2 keys at https://www.google.com/recaptcha/admin"
      - type: "TextLine"
        name: "recaptchaSecretKey"
        label: "reCAPTCHA v2 Secret Key"
        occurrences:
          min: 0
          max: 1
        helpText: "Both keys are required to enable reCAPTCHA. Manage your v2 keys at https://www.google.com/recaptcha/admin"
  - type: "FieldSet"
    label: "Proxy settings"
    items:
      - type: "ItemSet"
        name: "proxy"
        label: "Proxy"
        occurrences:
          min: 0
          max: 1
        items:
          - type: "TextLine"
            name: "host"
            label: "Host"
            occurrences:
              min: 1
              max: 1
          - type: "TextLine"
            name: "port"
            label: "Port"
            occurrences:
              min: 0
              max: 1
          - type: "TextLine"
            name: "user"
            label: "User"
            occurrences:
              min: 0
              max: 1
          - type: "TextLine"
            name: "password"
            label: "Password"
            occurrences:
              min: 0
              max: 1
