plugins {
    id 'maven-publish'
    id 'com.enonic.defaults' version '2.1.7'
    id 'com.enonic.xp.app'
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    include xplibs.content
    include xplibs.context
    include xplibs.io
    include xplibs.mail
    include xplibs.node
    include xplibs.portal
    include xplibs.auth
    include xplibs.repo
    include xplibs.cluster
    include libs.lib.thymeleaf
    include libs.lib.http.client
    include "com.enonic.lib:lib-asset:2.0.1"
    //include "com.enonic.lib:recaptcha:1.1.1"

    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly libs.graalvm.js
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo( "dev" )
}

test {
    useJUnitPlatform()
}

def testGraalJs = tasks.register('testGraalJs', Test) {
    group = 'verification'
    description = 'Runs tests with the GraalJS script engine.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'xp.script-engine', 'GraalJS'
    shouldRunAfter test
}

check.dependsOn testGraalJs
